<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORM ERROR 404 - Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
#login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; padding: 20px; }
#login h1 { color: #ff4444; font-size: 28px; margin-bottom: 20px; }
#login input { width: 100%; max-width: 300px; padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 16px; }
#login button { width: 100%; max-width: 300px; padding: 12px; border-radius: 10px; border: none; background: #ff4444; color: #fff; font-size: 16px; cursor: pointer; }
#login button:hover { background: #ff6666; }
#login p { color: #888; font-size: 14px; }
#login a { color: #ff4444; cursor: pointer; }
#error { color: #ff4444; font-size: 14px; min-height: 20px; }

#chat { display: none; flex-direction: column; height: 100vh; }
#header { padding: 15px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
#header h2 { color: #ff4444; font-size: 18px; }
#header span { color: #888; font-size: 12px; }
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
.msg.user { align-self: flex-end; background: #ff4444; color: #fff; }
.msg.bot { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; color: #ddd; }
.msg.bot pre { background: #0a0a0a; padding: 10px; border-radius: 8px; overflow-x: auto; margin-top: 8px; }
.msg.bot code { font-family: monospace; font-size: 13px; }
#input-area { padding: 15px 20px; border-top: 1px solid #333; display: flex; gap: 10px; }
#input-area textarea { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; resize: none; height: 50px; }
#input-area button { padding: 12px 24px; border-radius: 10px; border: none; background: #ff4444; color: #fff; font-size: 14px; cursor: pointer; }
#input-area button:disabled { opacity: 0.5; }
.typing { display: flex; gap: 4px; padding: 12px 16px; }
.typing span { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<div id="login">
  <h1>🐛 WORM ERROR 404</h1>
  <div id="login-form">
    <input type="email" id="email" placeholder="Email" value="anonymouscid0@gmail.com">
    <input type="password" id="password" placeholder="Mot de passe" value="cid_error404">
    <button onclick="login()">Se connecter</button>
    <p id="error"></p>
    <p>Pas de compte ? <a onclick="showRegister()">S'inscrire</a></p>
  </div>
  <div id="register-form" style="display:none;">
    <input type="text" id="reg-name" placeholder="Nom">
    <input type="email" id="reg-email" placeholder="Email">
    <input type="password" id="reg-password" placeholder="Mot de passe (min 6)">
    <button onclick="register()">Créer mon compte</button>
    <p id="reg-error"></p>
    <p>Déjà un compte ? <a onclick="showLogin()">Se connecter</a></p>
  </div>
</div>

<div id="chat">
  <div id="header">
    <h2>🐛 WORM ERROR 404</h2>
    <span id="user-info"></span>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="msg-input" placeholder="Pose ta question..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button id="send-btn" onclick="sendMessage()">Envoyer</button>
  </div>
</div>

<script>
const API = ''; // Même domaine

let token = localStorage.getItem('token');
let user = null;

if (token) showChat();

function showError(msg) { document.getElementById('error').textContent = msg; }
function showRegError(msg) { document.getElementById('reg-error').textContent = msg; }

function showRegister() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'flex';
  document.getElementById('register-form').style.flexDirection = 'column';
  document.getElementById('register-form').style.gap = '15px';
}
function showLogin() {
  document.getElementById('login-form').style.display = 'flex';
  document.getElementById('login-form').style.flexDirection = 'column';
  document.getElementById('register-form').style.display = 'none';
}

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  showError('Connexion...');
  
  try {
    const res = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    
    token = data.accessToken;
    user = data.user;
    localStorage.setItem('token', token);
    showChat();
  } catch (e) {
    showError(e.message || 'Erreur réseau');
  }
}

async function register() {
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  showRegError('Création...');
  
  try {
    const res = await fetch(API + '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    
    token = data.accessToken;
    user = data.user;
    localStorage.setItem('token', token);
    showChat();
  } catch (e) {
    showRegError(e.message || 'Erreur réseau');
  }
}

async function showChat() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
  
  try {
    const res = await fetch(API + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    user = await res.json();
    document.getElementById('user-info').textContent = (user.name || user.email) + ' | Plan: ' + user.plan;
  } catch(e) {}
  
  addMessage('bot', '👋 Salut ! Je suis WORM ERROR 404 v3. Pose-moi tes questions sur le code, les bugs, ou demande-moi de chercher quelque chose.');
}

function addMessage(sender, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  
  // Convertir markdown simple
  let html = text
    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  
  div.innerHTML = html;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  addMessage('user', text);
  
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  
  // Typing indicator
  const typing = document.createElement('div');
  typing.className = 'msg bot typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  typing.id = 'typing';
  document.getElementById('messages').appendChild(typing);
  
  try {
    const res = await fetch(API + '/v1/chat/completions', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'x-api-key': 'sk-worm-' + token
      },
      body: JSON.stringify({ 
        messages: [{ role: 'user', content: text }],
        model: 'worm-fullstack-v3'
      })
    });
    
    document.getElementById('typing').remove();
    
    if (!res.ok) {
      const err = await res.json();
      addMessage('bot', '❌ Erreur: ' + (err.error || 'Problème serveur'));
      return;
    }
    
    const data = await res.json();
    addMessage('bot', data.choices[0].message.content);
  } catch (e) {
    document.getElementById('typing')?.remove();
    addMessage('bot', '❌ Erreur réseau. Le serveur est peut-être en train de se réveiller (Render Free). Réessaie dans 10 secondes.');
  }
  
  btn.disabled = false;
}
</script>

</body>
</html>
